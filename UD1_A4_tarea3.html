<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabla Grupos de Edades - Tarea 3</title>
    <style>
        table {
            border-collapse: collapse;
            text-align: center;
        }
        th, td {
            border: 1px solid #000000;
            padding: 14px;
            vertical-align: middle;
        }
       
        .grupo {
            background-color: #BBBBFF;
            font-weight: bold;
        }
        
        .hombres-header {
            background-color: #FFBBBB;
        }
        
        .hombres-num {
            background-color: #FFBBBB;
        }
       
        .hombres-pct {
            background-color: #FFCCCC;
        }
        
        .mujeres-header {
            background-color: #AAFFAA;
        }
        
        .mujeres-num {
            background-color: #AAFFAA;
        }
        
        .mujeres-pct {
            background-color: #BBFFB8;
        }
        
        .cabecera {
            background-color: #BBBBFF;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <table>
        <tr>
            <th rowspan="2" class="cabecera">Grupos de edades</th>
            <th colspan="2" class="hombres-header">Hombres</th>
            <th colspan="2" class="mujeres-header">Mujeres</th>
        </tr>
        <tr>
            <th class="hombres-header">Num</th>
            <th class="hombres-header">%</th>
            <th class="mujeres-header">Num</th>
            <th class="mujeres-header">%</th>
        </tr>
        <tr>
            <td class="grupo">8-16</td>
            <td class="hombres-num">16</td>
            <td class="hombres-pct">14.5</td>
            <td class="mujeres-num">10</td>
            <td class="mujeres-pct">9</td>
        </tr>
        <tr>
            <td class="grupo">17-23</td>
            <td class="hombres-num">8</td>
            <td class="hombres-pct">7</td>
            <td class="mujeres-num">13</td>
            <td class="mujeres-pct">11.5</td>
        </tr>
        <tr>
            <td class="grupo">24-38</td>
            <td class="hombres-num">15</td>
            <td class="hombres-pct">14</td>
            <td class="mujeres-num">8</td>
            <td class="mujeres-pct">7</td>
        </tr>
        <tr>
            <td class="grupo">39-56</td>
            <td class="hombres-num">21</td>
            <td class="hombres-pct">19</td>
            <td class="mujeres-num">19</td>
            <td class="mujeres-pct">17</td>
        </tr>
    </table>
</body>
</html>
